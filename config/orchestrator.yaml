provider:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: openai/gpt-5.6-sol
  timeout: 120
  parameters:
    provider:
      only: [openai]
      allow_fallbacks: false
      require_parameters: true
ssh:
  execution_mode: direct
  host: ""
  key_path: ""
  remote_root: /mnt/src/agentic-design-jobs
  python_bin: /mnt/src/rfdiff-venv/bin/python
  rfdiffusion_root: /mnt/src/RFdiffusion
  device: cuda
  connect_timeout: 15
  command_timeout: 60
state:
  experiments_dir: .agentic-design/experiments
  jobs_dir: .agentic-design/jobs
  audit_dir: .agentic-design/audit
  results_dir: results
  inputs_dir: data/inputs
  examples_dir: demo-api
  notebook_dir: research/campaigns
limits:
  max_designs: 100
  max_agent_submissions: 1
  max_agent_turns: 12
  max_tool_calls_per_turn: 8
  max_transcript_bytes: 200000
