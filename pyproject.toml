[project]
name = "agentic-design"
version = "0.1.0"
description = "Agentic orchestration of RFdiffusion protein design workflows"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "numpy>=1.24"]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0,<2"]
test = ["pytest>=7"]

[project.scripts]
agentic-design = "agentic_design.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
